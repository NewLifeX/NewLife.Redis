name: aot

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  analyzer:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x
    - name: 库侧 AOT 分析器（net8.0 IsAotCompatible，要求 0 告警）
      run: |
        set -o pipefail
        dotnet build NewLife.Redis/NewLife.Redis.csproj -f net8.0 -c Release 2>&1 | tee analyzer-core.log
        dotnet build NewLife.Redis.Extensions/NewLife.Redis.Extensions.csproj -f net8.0 -c Release 2>&1 | tee analyzer-ext.log
        if grep -E "warning IL[0-9]+" analyzer-core.log analyzer-ext.log; then
          echo "::error::存在 AOT/裁剪分析器告警，必须清零"
          exit 1
        fi

  smoke:
    runs-on: ubuntu-latest
    env:
      # 拓扑由下方步骤保证；缺失时冒烟场景判定失败而非静默 SKIP，守住防回归
      AOT_REQUIRE_TOPO: 1

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x
    - name: Redis Server
      uses: nnhy/redis-github-action@v1.0
    - name: Redis 集群与哨兵拓扑（集群 7000-7002 / 哨兵主 7480 / 哨兵 26379）
      run: |
        # 阻止 apt 安装时自动启动 redis 服务（6379 已由上方动作的容器占用）
        printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
        sudo chmod +x /usr/sbin/policy-rc.d
        sudo apt-get update -qq
        sudo apt-get install -y -qq redis-server redis-tools
        sudo rm -f /usr/sbin/policy-rc.d

        # 3 节点集群
        for p in 7000 7001 7002; do
          mkdir -p /tmp/aot-redis/c$p
          cat > /tmp/aot-redis/c$p/redis.conf <<EOF
        port $p
        cluster-enabled yes
        cluster-config-file nodes.conf
        cluster-node-timeout 5000
        appendonly no
        save ""
        logfile /tmp/aot-redis/c$p/redis.log
        dir /tmp/aot-redis/c$p
        EOF
          redis-server /tmp/aot-redis/c$p/redis.conf --daemonize yes
        done

        # 等待节点就绪后建集群，并确认集群状态
        for i in $(seq 1 30); do redis-cli -p 7000 ping | grep -q PONG && break; sleep 1; done
        redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes
        for i in $(seq 1 30); do redis-cli -p 7000 cluster info | grep -q 'cluster_state:ok' && break; sleep 1; done
        redis-cli -p 7000 cluster info | grep -q 'cluster_state:ok'

        # 哨兵：主 7480 + 哨兵 26379
        mkdir -p /tmp/aot-redis/master /tmp/aot-redis/sentinel
        cat > /tmp/aot-redis/master/redis.conf <<EOF
        port 7480
        appendonly no
        save ""
        logfile /tmp/aot-redis/master/redis.log
        dir /tmp/aot-redis/master
        EOF
        redis-server /tmp/aot-redis/master/redis.conf --daemonize yes
        cat > /tmp/aot-redis/sentinel/sentinel.conf <<EOF
        port 26379
        dir /tmp/aot-redis/sentinel
        logfile /tmp/aot-redis/sentinel/sentinel.log
        sentinel monitor mymaster 127.0.0.1 7480 1
        sentinel down-after-milliseconds mymaster 5000
        EOF
        redis-server /tmp/aot-redis/sentinel/sentinel.conf --sentinel --daemonize yes
        for i in $(seq 1 30); do redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q 7480 && break; sleep 1; done
        redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q 7480

        echo "拓扑就绪：集群 7000-7002（cluster_state:ok），哨兵 26379 → 主 7480"
    - name: JIT 基线冒烟
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: NativeAOT 发布（linux-x64，要求 0 条 IL 告警）
      run: |
        set -o pipefail
        dotnet publish AotSmoke/AotSmoke.csproj -c Release -r linux-x64 -o out 2>&1 | tee publish.log
        if grep -E "warning IL[0-9]+" publish.log; then
          echo "::error::ILC 发布存在告警，必须清零"
          exit 1
        fi
    - name: NativeAOT 运行冒烟
      run: ./out/AotSmoke
